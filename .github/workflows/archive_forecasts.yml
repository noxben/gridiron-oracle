name: Archive Oracle Forecasts

on:
  workflow_dispatch:
    inputs:
      season:
        description: Target NFL season
        required: true
        type: number
      week:
        description: Target regular-season week (1-18)
        required: true
        type: number
      write:
        description: Write to BigQuery (otherwise preview only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install nflreadpy pandas python-dotenv

      - name: Run archive tests
        run: node --test scripts/test_archive_forecasts.mjs

      - name: Authenticate to Google Cloud
        if: inputs.write && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1071844431903/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ffl-oracle-archive-writer@ffl-oracle-513005.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Archive forecast
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "${{ inputs.write }}" = "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "ERROR: BigQuery writes are only permitted from main."
            exit 1
          fi

          ARGS="--season ${{ inputs.season }} --week ${{ inputs.week }}"
          if [ "${{ inputs.write }}" = "true" ]; then
            node scripts/archive_forecasts_bigquery.mjs $ARGS --write
          else
            node scripts/archive_forecasts_bigquery.mjs $ARGS
          fi

      - name: Upload local archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-archive-${{ inputs.season }}-week-${{ inputs.week }}
          path: outputs/forecast_archive/*.json
          if-no-files-found: warn
